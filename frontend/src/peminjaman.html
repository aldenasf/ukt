<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman - Peminjaman Alat Praktik</title>
    <link rel="stylesheet" href="css/output.css">
    <script src="js/peminjaman.js"></script>
</head>

<body>
    <header>
        <nav class="flex flex-row bg-blue-600 px-4 justify-between">
            <div class="flex justify-center items-center">
                <a href="/" class="font-bold text-white text-xl py-4 px-4">Peminjaman Alat Praktik</a>
            </div>
            <div class="flex flex-row">
                <a class="text-white bg-blue-800 hover:bg-blue-800 py-4 px-4 transition-colors duration-100"
                    href="peminjaman.html">Peminjaman</a>
                <a class="text-white hover:bg-blue-800 py-4 px-4 transition-colors duration-100"
                    href="alat.html">Alat</a>
                <a class="text-white hover:bg-blue-800 py-4 px-4 transition-colors duration-100"
                    href="kategori.html">Kategori</a>
            </div>
        </nav>
    </header>

    <main class="flex p-8 flex-col">
        <div class="flex flex-row py-2 justify-between items-center">
            <div>
                <h1 class="font-bold text-2xl">Peminjaman</h1>
            </div>
            <div class="flex flex-row">
                <button id="openAddModalBtn"
                    class="bg-blue-400 py-2 px-4 rounded-lg hover:bg-blue-500 transition-colors duration-100 cursor-pointer">Tambah
                    Peminjaman</button>
            </div>
        </div>

        <table class="min-w-full bg-white text-left text-sm border border-gray-200">
            <thead class="font-semibold uppercase">
                <tr class="bg-blue-400">
                    <th scope="col" class="px-6 py-2 text-center">ID</th>
                    <th scope="col" class="px-6 py-2">Nama</th>
                    <th scope="col" class="px-6 py-2">Kelas</th>
                    <th scope="col" class="px-6 py-2">Alat</th>
                    <th scope="col" class="px-6 py-2">Tanggal Pinjam</th>
                    <th scope="col" class="px-6 py-2">Tanggal Kembali</th>
                    <th scope="col" class="px-6 py-2">Jumlah</th>
                    <th scope="col" class="px-6 py-2">Status</th>
                    <th scope="col" class="px-6 py-2 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="peminjamanTable">

            </tbody>
        </table>

        <div class="flex flex-row justify-end mt-2 text-sm text-gray-800">
            <p id="peminjamanInfo"></p>
        </div>

        <dialog id="formModal"
            class="m-auto w-full max-w-md rounded-xl bg-white p-0 shadow-2xl backdrop:bg-slate-900/60 backdrop:backdrop-blur-xs">
            <div class="p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900" id="modalTitle"></h2>
                    <button id="closeModalBtn" type="button" aria-label="Close modal"
                        class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
                        ✕
                    </button>
                </div>

                <form id="form" class="mt-4 space-y-4">
                    <input type="hidden" id="idPeminjaman" name="idPeminjaman" />

                    <div>
                        <label for="namaPeminjam" class="block text-sm font-medium text-slate-700">Nama</label>
                        <input type="text" id="namaPeminjam" name="namaPeminjam" required placeholder="Awa Subaru"
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                    </div>

                    <div>
                        <label for="kelas" class="block text-sm font-medium text-slate-700">Kelas</label>
                        <input type="text" id="kelas" name="kelas" required placeholder="XI RPL A"
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                    </div>

                    <div>
                        <label for="idAlat" class="block text-sm font-medium text-slate-700">Alat</label>
                        <select name="idAlat" id="idAlat" required
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="" disabled selected>Pilih Alat</option>
                        </select>
                    </div>

                    <div>
                        <label for="jumlah" class="block text-sm font-medium text-slate-700">Jumlah</label>
                        <input type="number" id="jumlah" name="jumlah" min="1" required placeholder="1"
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                    </div>

                    <div>
                        <label for="tanggalKembali" class="block text-sm font-medium text-slate-700">Tanggal
                            Kembali</label>
                        <input type="date" id="tanggalKembali" name="tanggalKembali" required
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                    </div>

                    <div>
                        <label for="status" class="block text-sm font-medium text-slate-700">Status</label>
                        <select name="status" id="status" required
                            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-xs focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="Dipinjam">Dipinjam</option>
                            <option value="Dikembalikan">Dikembalikan</option>
                            <option value="Terlambat">Terlambat</option>
                        </select>
                    </div>

                    <div class="flex justify-end pt-4 gap-2">
                        <button id="cancelBtn" type="button"
                            class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 cursor-pointer">
                            Cancel
                        </button>
                        <button type="submit"
                            class="rounded-lg bg-blue-500 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-600 cursor-pointer">
                            Simpan
                        </button>
                    </div>
                </form>
            </div>
        </dialog>

        <dialog id="deleteModal"
            class="m-auto w-full max-w-sm rounded-xl bg-white p-0 shadow-2xl backdrop:bg-slate-900/60 backdrop:backdrop-blur-xs">
            <div class="p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900">Konfirmasi Hapus</h2>
                    <button id="closeDeleteModalBtn" type="button" aria-label="Close modal"
                        class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
                        ✕
                    </button>
                </div>

                <p class="mt-3 text-sm text-slate-600">
                    Apakah Anda yakin ingin menghapus <span id="deletePeminjamName" class="font-semibold
                text-slate-900"></span>? Tindakan ini tidak dapat dibatalkan.
                </p>

                <div class="flex justify-end pt-5 gap-2">
                    <button id="cancelDeleteBtn" type="button"
                        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 cursor-pointer">
                        Batal
                    </button>
                    <button id="confirmDeleteBtn" type="button"
                        class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 cursor-pointer">
                        Hapus
                    </button>
                </div>
            </div>
        </dialog>
    </main>
</body>

</html>
